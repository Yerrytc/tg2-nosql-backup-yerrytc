name: desastre

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: escriba BORRAR para eliminar todos los productos (simulacion de desastre)
        required: true

jobs:
  desastre:
    if: ${{ inputs.confirmar == 'BORRAR' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: obtener conexiones
        run: |
          echo "Cosmos__Endpoint=$(az cosmosdb show -n cosmos-tg2-yerrytc -g rg-tg2-yerrytc --query documentEndpoint -o tsv)" >> $GITHUB_ENV
          K=$(az cosmosdb keys list -n cosmos-tg2-yerrytc -g rg-tg2-yerrytc --query primaryMasterKey -o tsv)
          echo "::add-mask::$K"
          echo "Cosmos__Key=$K" >> $GITHUB_ENV
          C=$(az storage account show-connection-string -n sttg2backupyerry -g rg-tg2-yerrytc -o tsv)
          echo "::add-mask::$C"
          echo "BACKUP_STORAGE_CONNECTION=$C" >> $GITHUB_ENV
      - run: dotnet build src/BackupTool/BackupTool.csproj -c Release
      - name: eliminar los documentos del contenedor productos
        run: dotnet src/BackupTool/bin/Release/net10.0/BackupTool.dll destruir --confirmar
